spring.application.name=sbng
app.cors.allowed-origins=http://localhost:4200
# trust X-Forwarded-* headers from the nginx reverse proxy (see docker-compose.yml) so
# {baseUrl} in the OAuth2 redirect-uri below resolves to the origin the browser is
# actually using instead of the internal http://backend:8080
server.forward-headers-strategy=framework

# Local Keycloak (see docker-compose.yml / keycloak/realm-export.json), realm "sbng"
spring.security.oauth2.client.registration.keycloak.client-id=sbng-app
spring.security.oauth2.client.registration.keycloak.client-secret=sbng-secret
spring.security.oauth2.client.registration.keycloak.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.keycloak.scope=openid,profile,email
spring.security.oauth2.client.registration.keycloak.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
# Explicit endpoints instead of issuer-uri: issuer-uri makes Spring fetch
# /.well-known/openid-configuration during context startup, which would fail
# app startup (and @SpringBootTest) whenever the Keycloak container isn't running.
spring.security.oauth2.client.provider.keycloak.authorization-uri=http://localhost:9080/realms/sbng/protocol/openid-connect/auth
spring.security.oauth2.client.provider.keycloak.token-uri=http://localhost:9080/realms/sbng/protocol/openid-connect/token
spring.security.oauth2.client.provider.keycloak.jwk-set-uri=http://localhost:9080/realms/sbng/protocol/openid-connect/certs
spring.security.oauth2.client.provider.keycloak.user-info-uri=http://localhost:9080/realms/sbng/protocol/openid-connect/userinfo
spring.security.oauth2.client.provider.keycloak.user-name-attribute=preferred_username
