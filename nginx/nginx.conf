events {}

http {
    server {
        listen 80;

        # catch-all reverse proxy: the backend jar serves both the SPA static
        # files and the API from the same origin, so nginx just forwards
        # everything through - no path-based routing needed here.
        location / {
            proxy_pass http://backend:8080;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Spring's ForwardedHeaderFilter (server.forward-headers-strategy=framework)
            # reads X-Forwarded-Host, not the plain Host header, to build the OAuth2
            # redirect-uri - without it (or without the port on it) Spring silently
            # falls back to the default port for the scheme, which then won't match
            # Keycloak's configured redirect URI on a non-default port.
            proxy_set_header X-Forwarded-Host $http_host;
            # nginx's default proxy_redirect rewrites backend Location headers using its
            # own $scheme://$host (which is also port-stripped) - that clobbers the
            # correct absolute URL Spring already built from the forwarded headers above.
            proxy_redirect off;
        }
    }
}
